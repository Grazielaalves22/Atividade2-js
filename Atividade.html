<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>



    <div class="container">
        <h2>Calculadora de IMC</h2>
        
        <!-- Entradas de informação -->
        <div class="campo-grupo">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5">
        </div>

        <div class="campo-grupo">
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
        </div>

        <!-- Botão de ação -->
        <button id="btnCalcular">Calcular IMC</button>

        <!-- Elemento de retorno via DOM -->
        <div id="resultado"></div>
    </div>

    <!-- Importação do arquivo JavaScript externo -->
    



    <script src="./Atividade.js"></script>
</body>
</html>
